[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-gds"
version = "0.2.1"
description = "GOV.UK Design System-inspired components for non-GOV.UK Streamlit services"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Streamlit GDS contributors" }]
keywords = ["streamlit", "govuk", "gds", "design-system", "accessibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = ["streamlit>=1.61,<1.62"]

[project.urls]
Homepage = "https://github.com/TheH1VE/streamlit-GDS"
Documentation = "https://github.com/TheH1VE/streamlit-GDS#readme"
Repository = "https://github.com/TheH1VE/streamlit-GDS"
Issues = "https://github.com/TheH1VE/streamlit-GDS/issues"
Changelog = "https://github.com/TheH1VE/streamlit-GDS/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "numpy<2.5",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.8",
  "tomli>=2; python_version < '3.11'",
  "twine>=6.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["streamlit_gds*"]

[tool.setuptools.package-data]
streamlit_gds = ["py.typed", "frontend/dist/**/*", "frontend/dist/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["streamlit_gds"]

[[tool.streamlit.component.components]]
name = "catalog"
asset_dir = "frontend/dist"
