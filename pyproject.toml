[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-gds"
version = "0.1.0"
description = "GOV.UK Design System-inspired components for non-GOV.UK Streamlit services"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Streamlit GDS contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Streamlit",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["streamlit>=1.60,<2"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["streamlit_gds*"]

[tool.setuptools.package-data]
streamlit_gds = ["py.typed", "frontend/dist/**/*", "frontend/dist/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["streamlit_gds"]

[[tool.streamlit.component.components]]
name = "catalog"
asset_dir = "frontend/dist"
