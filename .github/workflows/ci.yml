name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: streamlit_gds/frontend/package-lock.json
      - run: npm ci
        working-directory: streamlit_gds/frontend
      - run: npm audit --omit=dev
        working-directory: streamlit_gds/frontend
      - run: npm test
        working-directory: streamlit_gds/frontend
      - run: npm run build
        working-directory: streamlit_gds/frontend
      - name: Verify committed frontend assets
        run: git diff --exit-code -- streamlit_gds/frontend/dist
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: npx playwright install chromium
        working-directory: streamlit_gds/frontend
      - run: npm run test:e2e
        working-directory: streamlit_gds/frontend
      - run: python -m ruff check .
      - run: python -m mypy streamlit_gds
      - run: python -m pytest --cov=streamlit_gds --cov-report=term-missing
      - run: python -m build
